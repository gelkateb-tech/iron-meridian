<title>Iron Meridian</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: a dark war-room map fills the screen; a command column sits on the right (stacks under the map on phones). Single dark look by choice. */
:root{
  color-scheme: dark;
  --bg:#090d0e;
  --panel:#10171a;
  --panel-2:#162024;
  --line:#24323a;
  --fg:#e4e0d4;
  --muted:#8b9a97;
  --accent:#e2a23d;
  --accent-ink:#1c1306;
  --danger:#e0574f;
  --ok:#74c27a;
  --sea:#081217;
  --you:#3f7fe0;
  --display:"Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --body:"Barlow", "Segoe UI", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--fg); font-family:var(--body); font-size:14px;
  box-sizing:border-box; display:flex; flex-direction:column; overflow:hidden;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:10px;
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
#app{flex:1; min-height:0; min-width:0; display:grid; grid-template-columns:minmax(0,1fr); grid-template-rows:auto minmax(0,1fr); gap:10px}
.short{display:none}

/* Header */
header{display:flex; flex-wrap:wrap; align-items:center; gap:8px 10px}
.brand{font-family:var(--display); font-weight:800; font-size:24px; letter-spacing:.08em; text-transform:uppercase; line-height:1; display:flex; align-items:baseline; gap:10px}
.brand small{font-family:var(--mono); font-size:11px; font-weight:500; letter-spacing:.06em; color:var(--muted)}
.res{display:flex; flex-wrap:wrap; gap:6px}
.chip{display:flex; align-items:baseline; gap:6px; padding:5px 10px; border:1px solid var(--line); border-radius:4px; background:var(--panel); font-family:var(--mono); font-size:13px; font-variant-numeric:tabular-nums}
.chip b{font-weight:600}
.chip .lbl{font-family:var(--body); font-size:10px; font-weight:600; letter-spacing:.12em; text-transform:uppercase; color:var(--muted)}
.chip .d{font-size:11px; color:var(--ok)}
.chip .d.neg{color:var(--danger)}
.chip.you{align-items:center; border-color:var(--you); box-shadow:0 0 0 1px var(--you) inset}
.chip{align-items:center}
.chip svg{flex:none}
.res-cash svg{color:#d9c47a} .res-oil svg{color:#9aa6b0} .res-metal svg{color:#a9b4bd} .res-food svg{color:#9cc46a} .res-mp svg{color:#d6b28e}
.chip.short{border-color:var(--danger); box-shadow:0 0 0 1px var(--danger) inset}
.chip.short b{color:var(--danger)}
.res .chip:not(.you) .lbl{display:none}
@media (min-width: 1800px){ .res .chip:not(.you) .lbl{display:inline} }
.bld{display:grid; grid-template-columns:1fr auto; gap:3px 8px; align-items:center; font-size:12.5px; padding:6px 0; border-top:1px solid var(--line)}
.bld:first-child{border-top:0}
.bld .nm{font-weight:600}
.bld .ds{grid-column:1 / -1; color:var(--muted); font-size:11.5px; line-height:1.35}
.bld .lv{font-family:var(--mono); font-size:11px; color:var(--muted)}
.bld .btn{font-size:11.5px; padding:5px 8px; white-space:nowrap}
.spacer{flex:1}
.clock{font-family:var(--mono); font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums}
.clock b{color:var(--fg); font-weight:600}
.seg{display:flex; border:1px solid var(--line); border-radius:4px; overflow:hidden}
.seg button{border:0; border-radius:0; background:var(--panel); color:var(--muted); font-family:var(--mono); font-size:12px; padding:6px 10px; cursor:pointer}
.seg button + button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink); font-weight:600}

/* Main */
main{min-height:0; display:grid; grid-template-columns:minmax(0,1fr) 336px; gap:10px}
#mapwrap{position:relative; min-height:0; border:1px solid var(--line); border-radius:6px; overflow:hidden; background:var(--sea)}
#map{position:absolute; inset:0; width:100%; height:100%; touch-action:none; cursor:crosshair; display:block}
.mapctl{position:absolute; left:10px; bottom:10px; display:flex; flex-direction:column; gap:4px}
.mapctl button{width:34px; height:34px; font-size:16px; padding:0}
#hint{position:absolute; top:auto; bottom:10px; left:50%; transform:translateX(-50%); max-width:calc(100% - 20px); padding:6px 12px; border-radius:4px; background:rgba(9,13,14,.88); border:1px solid var(--line); font-size:12.5px; color:var(--fg); pointer-events:none; text-align:center}
#hint:empty{display:none}
#mini{position:absolute; right:10px; bottom:10px; width:240px; height:126px; border:1px solid var(--line); border-radius:4px; background:#05090b; cursor:pointer; touch-action:none; box-shadow:0 6px 20px rgba(0,0,0,.5)}
#tip{position:absolute; z-index:5; width:230px; pointer-events:none; background:rgba(16,23,26,.96); border:1px solid var(--line); border-radius:5px; padding:9px 11px; font-size:12.5px; display:flex; flex-direction:column; gap:4px; box-shadow:0 8px 24px rgba(0,0,0,.45)}
#tip b{font-size:13.5px}
#tip .r{display:flex; justify-content:space-between; gap:8px; font-family:var(--mono); font-size:11.5px; color:var(--muted)}
#tip .r span:last-child{color:var(--fg)}

aside{min-height:0; overflow:auto; display:flex; flex-direction:column; gap:10px; padding-right:2px}
.card{background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:12px; display:flex; flex-direction:column; gap:10px; min-width:0}
.eyebrow{font-size:10.5px; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:var(--muted)}
h2{margin:0; font-family:var(--display); font-weight:800; font-size:26px; letter-spacing:.03em; line-height:1; text-wrap:balance}
.sub{color:var(--muted); font-size:13px; margin-top:-4px}
.kv{display:grid; grid-template-columns:auto 1fr; gap:4px 12px; font-size:13px}
.kv dt{color:var(--muted)}
.kv dd{margin:0; font-family:var(--mono); font-size:12.5px; text-align:right; font-variant-numeric:tabular-nums}
.row{display:flex; flex-wrap:wrap; gap:6px}
.btn, button{font:inherit; color:var(--fg); background:var(--panel-2); border:1px solid var(--line); border-radius:4px; padding:7px 10px; cursor:pointer}
.btn:hover:not(:disabled){border-color:var(--muted)}
.btn:disabled{opacity:.42; cursor:not-allowed}
.btn.primary{background:var(--accent); color:var(--accent-ink); border-color:var(--accent); font-weight:600}
button:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.units{display:grid; grid-template-columns:1fr 1fr; gap:6px}
.unit{display:flex; flex-direction:column; align-items:flex-start; gap:2px; text-align:left; padding:8px}
.unit .nm{font-weight:600; font-size:13px}
.unit .cost{font-family:var(--mono); font-size:11px; color:var(--muted)}
.unit .st{font-family:var(--mono); font-size:10.5px; color:var(--muted)}
.queue{display:flex; flex-direction:column; gap:4px; font-size:12.5px}
.qi{display:flex; justify-content:space-between; gap:8px; font-family:var(--mono); font-size:12px}
.bar{height:4px; background:var(--panel-2); border-radius:2px; overflow:hidden}
.bar i{display:block; height:100%; background:var(--accent)}
.comp{display:flex; flex-wrap:wrap; gap:6px}
.tag{font-family:var(--mono); font-size:12px; padding:3px 7px; border-radius:3px; background:var(--panel-2); border:1px solid var(--line)}
.status{font-size:12.5px; padding:6px 9px; border-radius:4px; background:var(--panel-2); border-left:3px solid var(--muted)}
.status.battle{border-left-color:var(--danger)}
.status.move{border-left-color:var(--accent)}
.status.cap{border-left-color:var(--ok)}
.odds{margin-top:6px; padding:5px 8px; border-radius:3px; font-size:12px; line-height:1.35}
.odds.good{background:rgba(116,194,122,.14); color:#a8dcab} .odds.even{background:rgba(226,162,61,.14); color:#f0c77e} .odds.bad{background:rgba(224,87,79,.16); color:#f2a29c}
.dot{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(226,162,61,0)}}
.steps{display:flex; flex-direction:column; gap:4px; font-size:12.5px}
.steps div{display:flex; gap:8px; align-items:baseline}
.steps i{font-style:normal; font-family:var(--mono); width:16px; flex:none; color:var(--muted)}
.steps .done{color:var(--muted); text-decoration:line-through}
.steps .done i{color:var(--ok); text-decoration:none}
.nudge{font-size:12.5px; padding:6px 9px; border-radius:4px; background:rgba(226,162,61,.12); border-left:3px solid var(--accent)}
.sw{display:inline-block; width:10px; height:10px; border-radius:2px; flex:none}
.nations{display:flex; flex-direction:column; gap:5px}
.nat{display:grid; grid-template-columns:auto 1fr auto auto; align-items:center; gap:8px; font-size:13px}
.nat .n{font-family:var(--mono); font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; text-align:right; min-width:3ch}
.nat.dead{opacity:.4; text-decoration:line-through}
.nat.you{font-weight:600}
.log{display:flex; flex-direction:column; gap:4px; font-size:12.5px; max-height:240px; overflow:auto}
.log .ev{display:grid; grid-template-columns:auto 1fr; gap:8px; min-width:0; text-align:left; padding:5px 8px; border:0; border-left:3px solid var(--line); border-radius:3px; background:var(--panel-2); font-size:12.5px; line-height:1.35; cursor:default}
.log button.ev{cursor:pointer}
.log button.ev:hover{background:#1c282d}
.log .ev.good{border-left-color:var(--ok)} .log .ev.bad{border-left-color:var(--danger)} .log .ev.info{border-left-color:var(--accent)}
.log time{font-family:var(--mono); font-size:11px; color:var(--muted); padding-top:1px}
#toasts{position:absolute; top:10px; left:10px; display:flex; flex-direction:column; gap:6px; width:min(290px, calc(100% - 20px)); pointer-events:none; z-index:4}
.toast{pointer-events:auto; text-align:left; padding:8px 11px; border-radius:4px; border:1px solid var(--line); border-left:4px solid var(--accent); background:rgba(16,23,26,.95); font-size:12.5px; line-height:1.35; box-shadow:0 8px 20px rgba(0,0,0,.4); animation:tin .25s ease-out}
.toast.bad{border-left-color:var(--danger)} .toast.good{border-left-color:var(--ok)}
@keyframes tin{from{opacity:0; transform:translateY(-6px)} to{opacity:1; transform:none}}
.armylist{display:flex; flex-direction:column; gap:4px}
.armylist button{display:flex; justify-content:space-between; text-align:left; font-size:12.5px; padding:6px 9px}
.muted{color:var(--muted)}
.small{font-size:12px}

.vbar{display:flex; flex-direction:column; gap:3px; min-width:110px; font-family:var(--mono); font-size:10.5px; color:var(--muted)}
.vbar .tr{height:5px; border-radius:3px; background:#24323a; overflow:hidden}
.vbar .tr i{display:block; height:100%; background:var(--accent)}
@media (max-width: 1700px){ .vbar{display:none} }
/* Stats */
.statgrid{display:grid; grid-template-columns:repeat(auto-fill, minmax(140px, 1fr)); gap:8px}
.statgrid div{display:flex; flex-direction:column; gap:2px; padding:9px 11px; border:1px solid var(--line); border-radius:5px; background:var(--panel-2)}
.statgrid b{font-family:var(--mono); font-size:18px; font-variant-numeric:tabular-nums}
.statgrid span{font-size:11px; color:var(--muted); letter-spacing:.04em}
.stab td{font-family:var(--mono); font-size:12px; font-variant-numeric:tabular-nums}
.stab td:nth-child(2){font-family:var(--body); font-size:13px}
.stab tr.me td{background:rgba(226,162,61,.08)} .stab tr.dead td{opacity:.45}
.charts{display:grid; grid-template-columns:repeat(auto-fit, minmax(300px, 1fr)); gap:12px}
.chart{margin:0; padding:10px; border:1px solid var(--line); border-radius:5px; background:var(--panel-2); min-width:0}
.chart figcaption{font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); font-weight:600; margin-bottom:4px}
.chart svg{width:100%; height:auto; display:block}
.legend2{display:flex; flex-wrap:wrap; gap:4px 10px; font-size:11px; color:var(--muted); margin-top:4px}
.legend2 i{display:inline-block; width:10px; height:3px; margin-right:4px; vertical-align:middle}
/* Unit rows */
.urows{display:flex; flex-direction:column; gap:5px}
.urow{display:grid; grid-template-columns:30px 1fr 70px auto; align-items:center; gap:8px; font-size:12.5px}
.urow svg{color:var(--fg)} .urow .un b{font-family:var(--mono); font-weight:600}
.uhp{height:5px; border-radius:3px; background:#24323a; overflow:hidden} .uhp i{display:block; height:100%}
.unum{font-family:var(--mono); font-size:11px; color:var(--muted); font-variant-numeric:tabular-nums}
.unit .nm{display:flex; align-items:center; gap:6px}
.modes{position:absolute; right:10px; top:10px; display:flex; border:1px solid var(--line); border-radius:4px; overflow:hidden; background:rgba(9,13,14,.9)}
.modes button{border:0; border-radius:0; background:transparent; color:var(--muted); font-size:11.5px; padding:5px 8px}
.modes button + button{border-left:1px solid var(--line)}
.modes button[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink); font-weight:600}
#selbox{position:absolute; border:1px dashed var(--accent); background:rgba(226,162,61,.08); pointer-events:none; z-index:3}
@media (max-width: 700px){ .modes{top:auto; bottom:52px; right:8px} .modes button{padding:4px 6px; font-size:10.5px} }
/* Side tabs */
.tabs{position:sticky; top:0; z-index:2; display:grid; grid-template-columns:repeat(3, 1fr); gap:0; border:1px solid var(--line); border-radius:6px; overflow:hidden; background:var(--panel); flex:none}
.tabs button{border:0; border-radius:0; background:var(--panel); color:var(--muted); font-size:12.5px; font-weight:600; letter-spacing:.04em; padding:9px 6px; display:flex; align-items:center; justify-content:center; gap:6px}
.tabs button + button{border-left:1px solid var(--line)}
.tabs button[aria-selected="true"]{background:var(--panel-2); color:var(--fg); box-shadow:inset 0 -2px 0 var(--accent)}
.log{max-height:none}
.units{grid-template-columns:1fr}
.unit{display:grid; grid-template-columns:1fr auto; gap:1px 10px; padding:6px 9px}
.unit .nm{grid-row:1} .unit .cost{grid-row:1; text-align:right} .unit .st{grid-column:1 / -1}
details.locked summary{cursor:pointer; font-size:12px; color:var(--muted); padding:4px 2px}
details.locked .units{margin-top:4px}
/* Header group */
.mgroup{display:flex; border:1px solid var(--line); border-radius:4px; overflow:hidden}
.mgroup .btn{border:0; border-radius:0}
.mgroup .btn + .btn{border-left:1px solid var(--line)}
kbd{font-family:var(--mono); font-size:10px; color:var(--muted); border:1px solid var(--line); border-radius:3px; padding:0 4px; margin-left:4px}
@keyframes rise{from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none}}
#modal:not([hidden]) .sheet{animation:rise .16s ease-out}
.flashg{animation:fg .9s ease-out} .flashr{animation:fr .9s ease-out}
@keyframes fg{0%{background:rgba(116,194,122,.35)} 100%{background:var(--panel)}}
@keyframes fr{0%{background:rgba(224,87,79,.35)} 100%{background:var(--panel)}}

/* Research */
#resbtn{display:flex; align-items:center; gap:7px}
.dot{width:7px; height:7px; border-radius:50%; background:var(--accent); box-shadow:0 0 0 3px rgba(226,162,61,.2)}
.rhead{display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:10px}
.tree{display:grid; grid-template-columns:repeat(7, minmax(0,1fr)); gap:12px}
.branch{display:flex; flex-direction:column; gap:14px; min-width:0}
.tnode{position:relative; display:flex; flex-direction:column; gap:5px; padding:10px; border:1px solid var(--line); border-radius:5px; background:var(--panel-2); min-height:132px}
.tnode + .tnode::before{content:""; position:absolute; left:50%; top:-15px; width:2px; height:14px; background:var(--line)}
.tnode.done{border-color:rgba(116,194,122,.55)}
.tnode.done + .tnode::before{background:var(--ok)}
.tnode.active{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent) inset}
.tnode.locked{opacity:.5}
.tnode b{font-size:13.5px; line-height:1.2}
.tier{font-family:var(--mono); font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}
.tdesc{font-size:12px; color:var(--muted); line-height:1.35; flex:1}
.tstate{font-family:var(--mono); font-size:11px; color:var(--muted)}
.tnode.done .tstate{color:var(--ok)}
.tnode .btn{font-size:11.5px; padding:6px 7px}
.sheet.wide{width:min(1120px, 100%)}
@media (max-width: 900px){ .tree{grid-template-columns:repeat(3, minmax(0,1fr))} }
@media (max-width: 560px){ .tree{grid-template-columns:repeat(2, minmax(0,1fr))} }

/* Production overview */
.ptab{width:100%; border-collapse:collapse; font-size:12.5px}
.ptab th{text-align:left; font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); font-weight:600; padding:6px 8px; border-bottom:1px solid var(--line)}
.ptab td{padding:7px 8px; border-bottom:1px solid var(--line); vertical-align:middle}
.ptab td b{font-size:13px}
.ptab .q{font-family:var(--mono); font-size:11.5px; color:var(--muted); min-width:150px}
.ptab .q .bar{margin-top:4px; width:140px}
.ub{display:flex; flex-wrap:wrap; gap:4px}
.ub .btn{padding:4px 7px; font-family:var(--mono); font-size:11px}
.rep{display:flex; align-items:center; gap:5px; font-size:12px; color:var(--muted); white-space:nowrap}
.tblwrap{overflow-x:auto}

/* Diplomacy */
#dipbtn{display:flex; align-items:center; gap:7px}
.badge{min-width:18px; height:18px; padding:0 5px; border-radius:9px; background:var(--danger); color:#fff; font-family:var(--mono); font-size:11px; font-weight:600; display:inline-flex; align-items:center; justify-content:center}
.dip{display:flex; flex-direction:column; gap:6px}
.drow{display:grid; grid-template-columns:minmax(150px, 1.2fr) minmax(120px, 1fr) minmax(0, 2.2fr); gap:10px; align-items:center; padding:9px 10px; border:1px solid var(--line); border-left:4px solid var(--c); border-radius:4px; background:var(--panel-2)}
.drow .nm b{font-size:14px; display:block}
.drow .nm span{font-family:var(--mono); font-size:11px; color:var(--muted)}
.rel{display:inline-block; font-family:var(--mono); font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; padding:2px 6px; border-radius:3px; color:#0b1012; font-weight:600}
.opbar{position:relative; height:6px; border-radius:3px; background:#24323a; margin-top:6px}
.opbar i{position:absolute; top:0; bottom:0; border-radius:3px}
.opbar::after{content:""; position:absolute; left:50%; top:-2px; bottom:-2px; width:1px; background:var(--muted)}
.dacts{display:flex; flex-wrap:wrap; gap:5px; justify-content:flex-end}
.dacts .btn{font-size:11.5px; padding:5px 8px}
.dacts .btn.war{border-color:rgba(224,87,79,.6); color:#f2a29c}
.dacts .hint{flex-basis:100%; text-align:right; font-size:11px; color:var(--muted)}
details.more{position:relative}
details.more summary{list-style:none; font-size:11.5px; padding:5px 8px}
details.more summary::-webkit-details-marker{display:none}
.morebox{position:absolute; right:0; top:calc(100% + 4px); z-index:3; display:flex; flex-direction:column; gap:4px; padding:6px; min-width:170px; background:var(--panel); border:1px solid var(--line); border-radius:4px; box-shadow:0 8px 20px rgba(0,0,0,.45)}
.drow{padding:7px 10px}
.offer{display:flex; flex-wrap:wrap; align-items:center; gap:8px; padding:9px 11px; border-radius:4px; background:rgba(226,162,61,.12); border-left:3px solid var(--accent)}
.offer span{flex:1; min-width:180px}
@media (max-width: 700px){ .drow{grid-template-columns:1fr} .dacts{justify-content:flex-start} .dacts .hint{text-align:left} }

/* Nation picker */
.picks{display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:8px}
.pick{display:flex; flex-direction:column; align-items:flex-start; gap:3px; text-align:left; padding:9px 10px; border-left:4px solid var(--c)}
.pick b{font-size:14px}
.pick span{font-family:var(--mono); font-size:11px; color:var(--muted)}
.sheet.mid > .row:last-child{position:sticky; bottom:-22px; background:var(--panel); padding:10px 0; margin:0; border-top:1px solid var(--line)}
.pick[aria-pressed="true"]{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent) inset; border-left-color:var(--c)}
.diff{font-family:var(--mono); font-size:10px; letter-spacing:.08em; text-transform:uppercase; padding:1px 5px; border-radius:3px; background:var(--panel)}

/* Modal */
#modal{position:fixed; inset:0; z-index:20; display:flex; align-items:center; justify-content:center; background:rgba(5,8,9,.62);
  padding:max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px))}
.sheet{width:min(560px, 100%); max-height:100%; overflow:auto; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:22px; display:flex; flex-direction:column; gap:14px; box-shadow:0 20px 60px rgba(0,0,0,.55)}
.sheet.mid{width:min(820px, 100%)}
.sheet h1{margin:0; font-family:var(--display); font-weight:800; font-size:34px; letter-spacing:.06em; text-transform:uppercase; line-height:.95}
.sheet p{margin:0; line-height:1.5; max-width:62ch}
.sheet ul{margin:0; padding-left:18px; line-height:1.55; display:flex; flex-direction:column; gap:3px}
.sheet .row{margin-top:4px}

@media (max-width: 820px){
  main{grid-template-columns:minmax(0,1fr); grid-template-rows:minmax(240px,1fr) minmax(0,42%)}
  .brand{font-size:20px}
  #mini{width:150px; height:79px}
}
@media (max-width: 480px){
  .res{flex-wrap:nowrap; overflow-x:auto; width:100%; scrollbar-width:none}
  .res .chip .d{display:none}
  #mini{display:none}
  .mapctl{flex-direction:row; left:8px; bottom:8px} .mapctl button{width:30px; height:30px}
  main{grid-template-rows:minmax(320px,60%) minmax(0,1fr)}
  #toasts{width:calc(100% - 20px); bottom:46px}
  .chip{padding:4px 7px; font-size:12px}
  .chip .lbl{display:none}
  .sheet h1{font-size:34px}
}
@media (max-width: 1500px){ header .brand{font-size:19px} }
@media (max-width: 1700px){ header .brand{display:none} }
.chip{white-space:nowrap}
@media (max-width: 480px){
  header{gap:6px}
  header .spacer{display:none}
  .clock{font-size:12px}
  .seg button{padding:5px 8px}
  #resbtn, #dipbtn, #helpbtn{padding:5px 7px; font-size:12px}
  .long{display:none} .short{display:inline}
  .seg button{padding:5px 6px}
  #hint{font-size:11.5px; padding:4px 8px; top:6px; bottom:auto}
}
@media (prefers-reduced-motion: reduce){ *{transition:none!important; animation:none!important} }

<div id="app">
  <header>
    <div class="brand">Iron Meridian <small id="seedlbl"></small></div>
    <div class="res" id="res"></div>
    <div class="spacer"></div>
    <div class="vbar" id="vbar" title="Progress to victory"></div>
    <div class="clock" id="clock"></div>
    <div class="seg" id="speed" role="group" aria-label="Game speed">
      <button id="sp0" data-speed="0" aria-pressed="true" title="Pause (Space)">❚❚</button>
      <button id="sp1" data-speed="1" aria-pressed="false" title="Normal (1)">1×</button>
      <button id="sp2" data-speed="2" aria-pressed="false" title="Fast (2)">2×</button>
      <button id="sp3" data-speed="3" aria-pressed="false" title="Fastest (3)">4×</button>
    </div>
    <div class="mgroup">
    <button class="btn" id="prodbtn" data-act="prod-open" title="Production overview (P)"><span class="long">Production</span><span class="short">Prod</span></button>
    <button class="btn" id="resbtn" data-act="research-open" title="Research tree (R)"><span class="long">Research</span><span class="short">Tech</span><span class="dot" id="resdot" title="No research running"></span></button>
    <button class="btn" id="dipbtn" data-act="diplo-open" title="Diplomacy (D)"><span class="long">Diplomacy</span><span class="short">Diplo</span><span class="badge" id="dipbadge" hidden></span></button>
    <button class="btn" id="mutebtn" data-act="mute" title="Sound on/off (M)" aria-pressed="false">♪</button>
    <button class="btn" id="helpbtn" data-act="help" title="How to play">?</button>
    </div>
  </header>
  <main>
    <div id="mapwrap">
      <canvas id="map" aria-label="World map"></canvas>
      <div id="hint"></div>
      <div id="tip" hidden></div>
      <div id="toasts" aria-live="polite"></div>
      <div class="mapctl">
        <button class="btn" id="zin" data-act="zin" aria-label="Zoom in">+</button>
        <button class="btn" id="zout" data-act="zout" aria-label="Zoom out">−</button>
        <button class="btn" id="zfit" data-act="zfit" aria-label="Whole world" title="Whole world" style="font-size:12px">⤢</button>
        <button class="btn" id="zhome" data-act="home" aria-label="Go to your capital" title="Go to your capital (H)" style="font-size:13px">⌂</button>
        <button class="btn" id="zrel" data-act="relmode" aria-label="Relations map" title="Relations map (V)" aria-pressed="false" style="font-size:12px">◐</button>
      </div>
      <canvas id="mini" aria-label="Minimap"></canvas>
      <div class="modes" id="modes" role="group" aria-label="Map mode"></div>
    </div>
    <aside id="side">
      <div class="tabs" role="tablist">
        <button role="tab" data-act="tab" data-tab="cmd" aria-selected="true">Command</button>
        <button role="tab" data-act="tab" data-tab="pow" aria-selected="false">Powers</button>
        <button role="tab" data-act="tab" data-tab="log" aria-selected="false">Dispatches<span class="badge" id="logbadge" hidden></span></button>
      </div>
      <section class="card" id="ctx" data-pane="cmd"></section>
      <section class="card" data-pane="pow" hidden>
        <div class="eyebrow">Powers</div>
        <div class="nations" id="nations"></div>
      </section>
      <section class="card" data-pane="log" hidden>
        <div class="eyebrow">Dispatches</div>
        <div class="log" id="log"></div>
      </section>
    </aside>
  </main>
</div>
<div id="modal" hidden><div class="sheet" id="sheet"></div></div>

  else if (e.key === 'v' || e.key === 'V'){ const i = MODES.findIndex(m => m[0] === mapMode); mapMode = MODES[(i + 1) % MODES.length][0]; renderSide(true); }
  else if (e.key === 's' || e.key === 'S'){ if (modalKind === 'stats') closeModal(); else if ($('modal').hidden) openModal(statsHTML(), 'stats'); }
  else if (e.key === 'm' || e.key === 'M'){ setMuted(!muted); renderSide(true); }
  else if (e.key === 'p' || e.key === 'P'){ if (modalKind === 'prod') closeModal(); else if ($('modal').hidden) openModal(prodHTML(), 'prod'); }
  else if (e.key === 'r' || e.key === 'R'){ if (modalKind === 'research') closeModal(); else if ($('modal').hidden) openModal(researchHTML(), 'research'); }
});
function setSpeed(s){ if (S.over && s) return; if (s && !$('modal').hidden) return; S.speed = s; renderSide(); }

/* ---------------- Modal ---------------- */
let modalKind = '', pickSel = POWERS.findIndex(p => p.name === 'Brazil');
const DIFF = {Brazil:'Easy', China:'Easy', Australia:'Easy', Canada:'Easy', Russia:'Easy', 'United States':'Normal', India:'Normal', 'South Africa':'Normal'};
let speedBefore = 0;
function openModal(html, kind = ''){ modalKind = kind; if (S && $('modal').hidden){ speedBefore = S.speed; } if (S) S.speed = 0; $('sheet').className = 'sheet' + (kind === 'research' || kind === 'diplo' || kind === 'stats' ? ' wide' : kind === 'picker' || kind === 'prod' ? ' mid' : ''); $('sheet').innerHTML = html; lastSig.sheet = html; $('modal').hidden = false; $('sheet').scrollTop = 0; if (S) renderSide(); }
function closeModal(restore = true){ $('modal').hidden = true; modalKind = ''; if (restore && S && !S.over && S.started) S.speed = speedBefore; renderSide(true); }
function rules(){ return `<ul>
  <li><b>Recruit</b> in your cities (squares and your capital star). Units cost cash, oil and manpower, and take days to train.</li>
  <li><b>Command many forces</b>: shift-click forces or shift-drag a box to select several, then tap a destination. Ctrl+4…9 saves a group, 4…9 recalls it. Cities can have a rally point for newly trained units.</li>
  <li><b>Terrain</b> matters: mountains (+30% defence, slow, bad for armor), forests (+15%), cities (+25%). Switch map modes (top right, or V) to see terrain, supply reach and resources.</li>
  <li><b>Move</b> by tapping one of your counters, then a province or sea zone to plan the route. Tap it again, or press Send, to march. Troops embark automatically to cross water.</li>
  <li><b>Capture</b> by parking ground units in a province with no defenders. Cities and capitals take longer. Air units can fight but cannot capture.</li>
  <li><b>Battles</b> run hour by hour. Defenders on their own soil take less damage, troops at sea take more. The blue bar under a counter is morale: armies that break retreat.</li>
  <li><b>Supply</b> reaches 8 hexes from your cities. Supplied troops heal (fastest in cities); troops cut off lose strength every day and get a red dashed outline.</li>
  <li><b>Strategic missiles</b>: research the Strategic branch, build a Missile Silo in a city, produce Cruise or Ballistic Missiles there and launch them at any province in range. SAMs and Frigates near the target can intercept them.</li>
  <li><b>Air power</b>: aircraft live in air wings at your airbases. Select a wing, tap a target inside its range ring: Strikers fly out, hit everything hostile there and return to rearm; Interceptors patrol a province and shoot down enemy strikes.</li>
  <li><b>Unit classes</b>: soft (infantry), armored and air. Lancers (3× vs armor) and Strikers beat armor, SAMs and Interceptors beat aircraft, artillery beats infantry. Hover a unit card for its role.</li>
  <li><b>Navy</b>: build a Naval Yard in a coastal city for Frigates, Submarines and Cruisers. Ships stay at sea or in friendly ports, escort troops crossing water (they take less damage), blockade enemy coasts and bombard coastal battles.</li>
  <li><b>Research</b> new technology from the Research button (or press R). Jets need Jet Engines; IFVs need Mechanized Infantry.</li>
  <li>The darker, hatched land is under fog of war: you only see enemy troops next to your land or your forces.</li>
  <li><b>Diplomacy</b> (D): every power starts at peace, and powers at peace cannot enter each other's land. Declare war, sign pacts and alliances, answer offers. Rivals may declare war on you from day 8.</li>
</ul>`; }
function provCount(pi){ const ci = powerCountry(POWERS[pi]); return ci >= 0 ? G.countries[ci].provs.length : 0; }
function showPicker(){
  if (!G) G = loadWorld();
  const cards = POWERS.map((P0, i) => { const n = provCount(i), cities = (G.countries[powerCountry(P0)]?.provs || []).filter(id => G.P[id].city).length;
    const diff = DIFF[P0.name] || 'Hard';
    return {i, n, html:`<button class="btn pick" style="--c:${P0.color}" data-act="pick" data-p="${i}" aria-pressed="${i === pickSel}"><b>${P0.name}</b><span>${n} provinces · ${cities} cities</span><span class="diff">${diff}</span></button>`}; })
    .sort((a, b) => b.n - a.n).map(c => c.html).join('');
  openModal(`<div class="eyebrow">New campaign</div><h1>Choose your nation</h1>
    <p>Fifteen powers fight for the world. Big nations start with more land and cities; small ones must expand fast. Every other country is independent and can be taken.</p>
    <div class="picks">${cards}</div>
    <div class="row"><button class="btn primary" data-act="begin">Lead ${POWERS[pickSel].name}</button>${S && S.started && !S.over ? `<button class="btn" data-act="resume">Back</button>` : ''}</div>`, 'picker');
}
function showBriefing(first, hasSave){
  const sv = hasSave ? loadSaved() : null, me = sv ? sv.nations[0] : S.nations[PLAYER];
  openModal(`<div class="eyebrow">Campaign briefing</div><h1>Iron Meridian</h1>
    ${sv ? `<p class="nudge">Saved campaign: <b>${me.name}</b>, day ${dayOf(sv.hour)}.</p>` : ''}
    <p>You command <b style="color:${me.color}">${me.name}</b>, one of fifteen powers in a world at war. Take independent land, out-produce your rivals and hold ${landNeed(PLAYER)} land provinces or ${WIN_CAPS} starting capitals.</p>
    ${rules()}
    <p class="small muted">Your land has a bright outline and your capital says YOUR CAPITAL. Drag to pan, scroll or pinch to zoom, use the minimap to jump. Space pauses, 1–3 set speed, P production, R research, D diplomacy, S statistics, V relations map, M sound, H home. Progress saves in this browser each game day.</p>
    <div class="row">${first
      ? (hasSave ? `<button class="btn primary" data-act="continue">Continue campaign</button><button class="btn" data-act="newgame">New campaign</button>` : `<button class="btn primary" data-act="start">Start campaign</button>`)
      : `<button class="btn primary" data-act="resume">Back to the map</button><button class="btn" data-act="newgame">New campaign…</button>`}</div>`);
}
function warWarning(a){
  if (!$('modal').hidden) return;
  const E = S.nations[a];
  const front = G.P.filter(P => !P.sea && S.owner[P.id] === PLAYER && P.nbs.some(v => S.owner[v] === a));
  const threat = front.map(P => ({P, foe:P.nbs.filter(v => S.owner[v] === a).reduce((s0, v) => s0 + S.armies.filter(x => x.owner === a && x.at === v && x.to === null).reduce((s1, x) => s1 + power(x), 0), 0),
    mine:S.armies.filter(x => x.owner === PLAYER && x.at === P.id && x.to === null).reduce((s1, x) => s1 + power(x), 0)})).sort((x, y) => (y.foe - y.mine) - (x.foe - x.mine));
  const list = threat.slice(0, 5).map(t => `<li><b>${t.P.cityName || t.P.name}</b>: enemy strength nearby ${Math.round(t.foe)}, yours ${Math.round(t.mine)}${t.foe > t.mine*1.2 ? ' <span style="color:var(--danger)">· at risk</span>' : ''}</li>`).join('');
  openModal(`<div class="eyebrow" style="color:var(--danger)">War declared</div><h1>${E.name} attacks</h1>
    <p>${E.name} declared war on you. Fighting starts in 24 hours. Their military is ${natPower(a) > natPower(PLAYER)*1.4 ? 'stronger than' : natPower(a) < natPower(PLAYER)*0.7 ? 'weaker than' : 'similar to'} yours.</p>
    ${front.length ? `<div class="eyebrow">Threatened border provinces</div><ul>${list}</ul>` : `<p>You share no land border, so expect them by sea or through allies.</p>`}
    <p class="small muted">Move forces onto the threatened provinces (defenders get +25% on home soil and Fortifications help), recruit in nearby cities, or try diplomacy: peace for tribute, or allies against ${E.name}.</p>
    <div class="row">${threat[0] ? `<button class="btn primary" data-act="goto" data-id="${threat[0].P.id}">Go to ${threat[0].P.cityName || threat[0].P.name}</button>` : ''}<button class="btn" data-act="diplo-open">Diplomacy</button><button class="btn" data-act="resume">Back to the map</button></div>`, 'war');
}
function showEnd(){
  const win = S.over === 'win', mine = S.owner.filter(o => o === PLAYER).length;
  openModal(`<div class="eyebrow">${clockStr(S.hour)}</div><h1>${win ? 'Victory' : 'Defeat'}</h1>
    <p>${S.overReason === 'time' ? `Day ${DAY_LIMIT} has ended. ${win ? `${S.nations[PLAYER].name} grew the most (+${growth(PLAYER)} score).` : `${S.nations[PLAYER].name} grew ${growth(PLAYER) >= 0 ? '+' : ''}${growth(PLAYER)}, behind the leader.`}` : ''}
    ${S.overReason && S.overReason !== 'time' ? `${S.overReason} has achieved world dominance.` : ''}
    ${!S.overReason ? (win ? `${S.nations[PLAYER].name} controls ${mine} of ${G.landCount} land provinces and ${capsHeld(PLAYER)} capitals. The world is yours.` : `${S.nations[PLAYER].name} has lost its last city.`) : ''}${!win && S.nations[PLAYER].cash > 200 ? ` You had $${fmt(S.nations[PLAYER].cash)}M unspent: next time, turn money into troops and research early.` : ''}</p>
    ${(() => { const st0 = S.stats || {}; return `<div class="statgrid">${[['Days', dayOf(S.hour)], ['Provinces taken', st0.taken || 0], ['Enemy units destroyed', st0.unitsKilled || 0], ['Units lost', st0.unitsLost || 0], ['Peak army', st0.peakArmy || 0], ['Best rank', st0.bestRank ? '#' + st0.bestRank : '—']].map(([k, v]) => `<div><b>${v}</b><span>${k}</span></div>`).join('')}</div>${st0.bigBattle ? `<p class="small muted">Biggest battle: ${st0.bigBattle} units at ${st0.bigBattleAt} on day ${st0.bigBattleDay}.</p>` : ''}${chartSVG(0, 'Score over the campaign')}`; })()}
    <div class="row"><button class="btn primary" data-act="newgame">New campaign</button><button class="btn" data-act="stats-open">Full statistics</button><button class="btn" data-act="resume">View the map</button></div>`, 'end');
  sfx(win ? 'win' : 'lose');
}

/* ---------------- Loop & boot ---------------- */
let last = 0, acc = 0, uiAcc = 0;
function frame(now){
  const dt = Math.min(0.25, (now - (last || now))/1000); last = now;
  if (S.speed && !S.over){ acc += dt*HOURS_PER_SEC[S.speed]; let n = 0; while (acc >= 1 && n < 8){ tick(); acc -= 1; n++; } if (n >= 8) acc = 0; }
  uiAcc += dt; if (uiAcc > 0.25){ uiAcc = 0; renderSide(); if (mouse && !tip.hidden) tipShow(mouse.x, mouse.y); }
  draw(now);
  requestAnimationFrame(frame);
}
function start(data){
  const css = getComputedStyle(document.documentElement);
  MONO = css.getPropertyValue('--mono').trim() || MONO; BODY = css.getPropertyValue('--body').trim() || BODY; DISPLAY = css.getPropertyValue('--display').trim() || DISPLAY;
  const saved = loadSaved();
  let resumed = false;
  if (data && data.state && restore(data.state)) resumed = true;
  if (!resumed) newGame((Math.random()*2**31) | 0, pickSel);
  resize(); if (resumed && data.view) Object.assign(view, data.view); else goHome();
  new ResizeObserver(() => resize()).observe(cv);
  renderSide(true);
  if (!resumed){ if (saved && saved.v === 3 && !saved.over) showBriefing(true, true); else showPicker(); }
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => renderSide(true));
  booted = true;
  if (window.U3D) U3D.warmup();
  requestAnimationFrame(frame);
}
if (location.protocol === 'file:') window.__im = {get S(){ return S; }, get G(){ return G; }, view, toScreen: (x, y) => toScreen(x, y), tick: () => tick(), findPath: (a, b) => findPath(a, b), orderMove: (a, p) => orderMove(a, p), selectProv: p => selectProv(p), selectArmy: id => selectArmy(id), setTarget: (id, p) => setTarget(armyById(id), p)};
document.addEventListener('visibilitychange', () => { if (document.hidden && S) save(); });
const hot = window.claude && window.claude.hot;
if (hot && hot.snapshot) try { hot.snapshot(() => ({state:serialize(), view:{...view}})); } catch (e) {}
if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
})();
</script>
