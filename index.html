<title>Iron Meridian</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: a dark war-room map fills the screen; a command column sits on the right (stacks under the map on phones). Single dark look by choice. */
:root{
  color-scheme: dark;
  --bg:#090d0e;
  --panel:#10171a;
  --panel-2:#162024;
  --line:#24323a;
  --fg:#e4e0d4;
  --muted:#8b9a97;
  --accent:#e2a23d;
  --accent-ink:#1c1306;
  --danger:#e0574f;
  --ok:#74c27a;
  --sea:#081217;
  --you:#3f7fe0;
  --display:"Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --body:"Barlow", "Segoe UI", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--fg); font-family:var(--body); font-size:14px;
  box-sizing:border-box; display:flex; flex-direction:column; overflow:hidden;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:10px;
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
#app{flex:1; min-height:0; display:grid; grid-template-rows:auto minmax(0,1fr); gap:10px}

/* Header */
header{display:flex; flex-wrap:wrap; align-items:center; gap:8px 18px}
.brand{font-family:var(--display); font-weight:800; font-size:24px; letter-spacing:.08em; text-transform:uppercase; line-height:1; display:flex; align-items:baseline; gap:10px}
.brand small{font-family:var(--mono); font-size:11px; font-weight:500; letter-spacing:.06em; color:var(--muted)}
.res{display:flex; flex-wrap:wrap; gap:6px}
.chip{display:flex; align-items:baseline; gap:6px; padding:5px 10px; border:1px solid var(--line); border-radius:4px; background:var(--panel); font-family:var(--mono); font-size:13px; font-variant-numeric:tabular-nums}
.chip b{font-weight:600}
.chip .lbl{font-family:var(--body); font-size:10px; font-weight:600; letter-spacing:.12em; text-transform:uppercase; color:var(--muted)}
.chip .d{font-size:11px; color:var(--ok)}
.chip .d.neg{color:var(--danger)}
.chip.you{align-items:center; border-color:var(--you); box-shadow:0 0 0 1px var(--you) inset}
.chip{align-items:center}
.chip svg{flex:none}
.res-cash svg{color:#d9c47a} .res-oil svg{color:#9aa6b0} .res-metal svg{color:#a9b4bd} .res-food svg{color:#9cc46a} .res-mp svg{color:#d6b28e}
.chip.short{border-color:var(--danger); box-shadow:0 0 0 1px var(--danger) inset}
.chip.short b{color:var(--danger)}
.res .chip:not(.you) .lbl{display:none}
@media (min-width: 1680px){ .res .chip:not(.you) .lbl{display:inline} }
.bld{display:grid; grid-template-columns:1fr auto; gap:3px 8px; align-items:center; font-size:12.5px; padding:6px 0; border-top:1px solid var(--line)}
.bld:first-child{border-top:0}
.bld .nm{font-weight:600}
.bld .ds{grid-column:1 / -1; color:var(--muted); font-size:11.5px; line-height:1.35}
.bld .lv{font-family:var(--mono); font-size:11px; color:var(--muted)}
.bld .btn{font-size:11.5px; padding:5px 8px; white-space:nowrap}
.spacer{flex:1}
.clock{font-family:var(--mono); font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums}
.clock b{color:var(--fg); font-weight:600}
.seg{display:flex; border:1px solid var(--line); border-radius:4px; overflow:hidden}
.seg button{border:0; border-radius:0; background:var(--panel); color:var(--muted); font-family:var(--mono); font-size:12px; padding:6px 10px; cursor:pointer}
.seg button + button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink); font-weight:600}

/* Main */
main{min-height:0; display:grid; grid-template-columns:minmax(0,1fr) 336px; gap:10px}
#mapwrap{position:relative; min-height:0; border:1px solid var(--line); border-radius:6px; overflow:hidden; background:var(--sea)}
#map{position:absolute; inset:0; width:100%; height:100%; touch-action:none; cursor:crosshair; display:block}
.mapctl{position:absolute; left:10px; bottom:10px; display:flex; flex-direction:column; gap:4px}
.mapctl button{width:34px; height:34px; font-size:16px; padding:0}
#hint{position:absolute; top:10px; left:50%; transform:translateX(-50%); max-width:calc(100% - 20px); padding:6px 12px; border-radius:4px; background:rgba(9,13,14,.88); border:1px solid var(--line); font-size:12.5px; color:var(--fg); pointer-events:none; text-align:center}
#hint:empty{display:none}
#mini{position:absolute; right:10px; bottom:10px; width:240px; height:126px; border:1px solid var(--line); border-radius:4px; background:#05090b; cursor:pointer; touch-action:none; box-shadow:0 6px 20px rgba(0,0,0,.5)}
#tip{position:absolute; z-index:5; width:230px; pointer-events:none; background:rgba(16,23,26,.96); border:1px solid var(--line); border-radius:5px; padding:9px 11px; font-size:12.5px; display:flex; flex-direction:column; gap:4px; box-shadow:0 8px 24px rgba(0,0,0,.45)}
#tip b{font-size:13.5px}
#tip .r{display:flex; justify-content:space-between; gap:8px; font-family:var(--mono); font-size:11.5px; color:var(--muted)}
#tip .r span:last-child{color:var(--fg)}

aside{min-height:0; overflow:auto; display:flex; flex-direction:column; gap:10px; padding-right:2px}
.card{background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:12px; display:flex; flex-direction:column; gap:10px; min-width:0}
.eyebrow{font-size:10.5px; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:var(--muted)}
h2{margin:0; font-family:var(--display); font-weight:800; font-size:26px; letter-spacing:.03em; line-height:1; text-wrap:balance}
.sub{color:var(--muted); font-size:13px; margin-top:-4px}
.kv{display:grid; grid-template-columns:auto 1fr; gap:4px 12px; font-size:13px}
.kv dt{color:var(--muted)}
.kv dd{margin:0; font-family:var(--mono); font-size:12.5px; text-align:right; font-variant-numeric:tabular-nums}
.row{display:flex; flex-wrap:wrap; gap:6px}
.btn, button{font:inherit; color:var(--fg); background:var(--panel-2); border:1px solid var(--line); border-radius:4px; padding:7px 10px; cursor:pointer}
.btn:hover:not(:disabled){border-color:var(--muted)}
.btn:disabled{opacity:.42; cursor:not-allowed}
.btn.primary{background:var(--accent); color:var(--accent-ink); border-color:var(--accent); font-weight:600}
button:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.units{display:grid; grid-template-columns:1fr 1fr; gap:6px}
.unit{display:flex; flex-direction:column; align-items:flex-start; gap:2px; text-align:left; padding:8px}
.unit .nm{font-weight:600; font-size:13px}
.unit .cost{font-family:var(--mono); font-size:11px; color:var(--muted)}
.unit .st{font-family:var(--mono); font-size:10.5px; color:var(--muted)}
.queue{display:flex; flex-direction:column; gap:4px; font-size:12.5px}
.qi{display:flex; justify-content:space-between; gap:8px; font-family:var(--mono); font-size:12px}
.bar{height:4px; background:var(--panel-2); border-radius:2px; overflow:hidden}
.bar i{display:block; height:100%; background:var(--accent)}
.comp{display:flex; flex-wrap:wrap; gap:6px}
.tag{font-family:var(--mono); font-size:12px; padding:3px 7px; border-radius:3px; background:var(--panel-2); border:1px solid var(--line)}
.status{font-size:12.5px; padding:6px 9px; border-radius:4px; background:var(--panel-2); border-left:3px solid var(--muted)}
.status.battle{border-left-color:var(--danger)}
.status.move{border-left-color:var(--accent)}
.status.cap{border-left-color:var(--ok)}
.odds{margin-top:6px; padding:5px 8px; border-radius:3px; font-size:12px; line-height:1.35}
.odds.good{background:rgba(116,194,122,.14); color:#a8dcab} .odds.even{background:rgba(226,162,61,.14); color:#f0c77e} .odds.bad{background:rgba(224,87,79,.16); color:#f2a29c}
.dot{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(226,162,61,0)}}
.steps{display:flex; flex-direction:column; gap:4px; font-size:12.5px}
.steps div{display:flex; gap:8px; align-items:baseline}
.steps i{font-style:normal; font-family:var(--mono); width:16px; flex:none; color:var(--muted)}
.steps .done{color:var(--muted); text-decoration:line-through}
.steps .done i{color:var(--ok); text-decoration:none}
.nudge{font-size:12.5px; padding:6px 9px; border-radius:4px; background:rgba(226,162,61,.12); border-left:3px solid var(--accent)}
.sw{display:inline-block; width:10px; height:10px; border-radius:2px; flex:none}
.nations{display:flex; flex-direction:column; gap:5px}
.nat{display:grid; grid-template-columns:auto 1fr auto auto; align-items:center; gap:8px; font-size:13px}
.nat .n{font-family:var(--mono); font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; text-align:right; min-width:3ch}
.nat.dead{opacity:.4; text-decoration:line-through}
.nat.you{font-weight:600}
.log{display:flex; flex-direction:column; gap:4px; font-size:12.5px; max-height:240px; overflow:auto}
.log .ev{display:grid; grid-template-columns:auto 1fr; gap:8px; min-width:0; text-align:left; padding:5px 8px; border:0; border-left:3px solid var(--line); border-radius:3px; background:var(--panel-2); font-size:12.5px; line-height:1.35; cursor:default}
.log button.ev{cursor:pointer}
.log button.ev:hover{background:#1c282d}
.log .ev.good{border-left-color:var(--ok)} .log .ev.bad{border-left-color:var(--danger)} .log .ev.info{border-left-color:var(--accent)}
.log time{font-family:var(--mono); font-size:11px; color:var(--muted); padding-top:1px}
#toasts{position:absolute; top:10px; right:10px; display:flex; flex-direction:column; gap:6px; width:min(300px, calc(100% - 20px)); pointer-events:none; z-index:4}
.toast{pointer-events:auto; text-align:left; padding:8px 11px; border-radius:4px; border:1px solid var(--line); border-left:4px solid var(--accent); background:rgba(16,23,26,.95); font-size:12.5px; line-height:1.35; box-shadow:0 8px 20px rgba(0,0,0,.4); animation:tin .25s ease-out}
.toast.bad{border-left-color:var(--danger)} .toast.good{border-left-color:var(--ok)}
@keyframes tin{from{opacity:0; transform:translateY(-6px)} to{opacity:1; transform:none}}
.armylist{display:flex; flex-direction:column; gap:4px}
.armylist button{display:flex; justify-content:space-between; text-align:left; font-size:12.5px; padding:6px 9px}
.muted{color:var(--muted)}
.small{font-size:12px}

/* Research */
#resbtn{display:flex; align-items:center; gap:7px}
.dot{width:7px; height:7px; border-radius:50%; background:var(--accent); box-shadow:0 0 0 3px rgba(226,162,61,.2)}
.rhead{display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:10px}
.tree{display:grid; grid-template-columns:repeat(6, minmax(0,1fr)); gap:14px}
.branch{display:flex; flex-direction:column; gap:14px; min-width:0}
.tnode{position:relative; display:flex; flex-direction:column; gap:5px; padding:10px; border:1px solid var(--line); border-radius:5px; background:var(--panel-2); min-height:132px}
.tnode + .tnode::before{content:""; position:absolute; left:50%; top:-15px; width:2px; height:14px; background:var(--line)}
.tnode.done{border-color:rgba(116,194,122,.55)}
.tnode.done + .tnode::before{background:var(--ok)}
.tnode.active{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent) inset}
.tnode.locked{opacity:.5}
.tnode b{font-size:13.5px; line-height:1.2}
.tier{font-family:var(--mono); font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}
.tdesc{font-size:12px; color:var(--muted); line-height:1.35; flex:1}
.tstate{font-family:var(--mono); font-size:11px; color:var(--muted)}
.tnode.done .tstate{color:var(--ok)}
.tnode .btn{font-size:11.5px; padding:6px 7px}
.sheet.wide{width:min(1120px, 100%)}
@media (max-width: 900px){ .tree{grid-template-columns:repeat(3, minmax(0,1fr))} }
@media (max-width: 560px){ .tree{grid-template-columns:repeat(2, minmax(0,1fr))} }

/* Nation picker */
.picks{display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:8px}
.pick{display:flex; flex-direction:column; align-items:flex-start; gap:3px; text-align:left; padding:9px 10px; border-left:4px solid var(--c)}
.pick b{font-size:14px}
.pick span{font-family:var(--mono); font-size:11px; color:var(--muted)}
.sheet.mid > .row:last-child{position:sticky; bottom:-22px; background:var(--panel); padding:10px 0; margin:0; border-top:1px solid var(--line)}
.pick[aria-pressed="true"]{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent) inset; border-left-color:var(--c)}
.diff{font-family:var(--mono); font-size:10px; letter-spacing:.08em; text-transform:uppercase; padding:1px 5px; border-radius:3px; background:var(--panel)}

/* Modal */
#modal{position:fixed; inset:0; z-index:20; display:flex; align-items:center; justify-content:center; background:rgba(5,8,9,.62);
  padding:max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px))}
.sheet{width:min(560px, 100%); max-height:100%; overflow:auto; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:22px; display:flex; flex-direction:column; gap:14px; box-shadow:0 20px 60px rgba(0,0,0,.55)}
.sheet.mid{width:min(820px, 100%)}
.sheet h1{margin:0; font-family:var(--display); font-weight:800; font-size:44px; letter-spacing:.06em; text-transform:uppercase; line-height:.95}
.sheet p{margin:0; line-height:1.5; max-width:62ch}
.sheet ul{margin:0; padding-left:18px; line-height:1.55; display:flex; flex-direction:column; gap:3px}
.sheet .row{margin-top:4px}

@media (max-width: 820px){
  main{grid-template-columns:minmax(0,1fr); grid-template-rows:minmax(240px,1fr) minmax(0,42%)}
  .brand{font-size:20px}
  #mini{width:150px; height:79px}
}
@media (max-width: 480px){
  .chip{padding:4px 7px; font-size:12px}
  .chip .lbl{display:none}
  .sheet h1{font-size:34px}
}
@media (prefers-reduced-motion: reduce){ *{transition:none!important; animation:none!important} }
</style>

<div id="app">
  <header>
    <div class="brand">Iron Meridian <small id="seedlbl"></small></div>
    <div class="res" id="res"></div>
    <div class="spacer"></div>
    <div class="clock" id="clock"></div>
    <div class="seg" id="speed" role="group" aria-label="Game speed">
      <button id="sp0" data-speed="0" aria-pressed="true" title="Pause (Space)">❚❚</button>
      <button id="sp1" data-speed="1" aria-pressed="false" title="Normal (1)">1×</button>
      <button id="sp2" data-speed="2" aria-pressed="false" title="Fast (2)">2×</button>
      <button id="sp3" data-speed="3" aria-pressed="false" title="Fastest (3)">4×</button>
    </div>
    <button class="btn" id="resbtn" data-act="research-open" title="Research tree (R)">Research<span class="dot" id="resdot" title="No research running"></span></button>
    <button class="btn" id="helpbtn" data-act="help" title="How to play">?</button>
  </header>
  <main>
    <div id="mapwrap">
      <canvas id="map" aria-label="World map"></canvas>
      <div id="hint"></div>
      <div id="tip" hidden></div>
      <div id="toasts" aria-live="polite"></div>
      <div class="mapctl">
        <button class="btn" id="zin" data-act="zin" aria-label="Zoom in">+</button>
        <button class="btn" id="zout" data-act="zout" aria-label="Zoom out">−</button>
        <button class="btn" id="zfit" data-act="zfit" aria-label="Whole world" title="Whole world" style="font-size:12px">⤢</button>
        <button class="btn" id="zhome" data-act="home" aria-label="Go to your capital" title="Go to your capital (H)" style="font-size:13px">⌂</button>
      </div>
      <canvas id="mini" aria-label="Minimap"></canvas>
    </div>
    <aside id="side">
      <section class="card" id="ctx"></section>
      <section class="card">
        <div class="eyebrow">Powers</div>
        <div class="nations" id="nations"></div>
      </section>
      <section class="card">
        <div class="eyebrow">Dispatches</div>
        <div class="log" id="log"></div>
      </section>
    </aside>
  </main>
</div>
<div id="modal" hidden><div class="sheet" id="sheet"></div></div>

<script src="world.js"></script>
<script>
(() => {
'use strict';
const WORLD = window.WORLD;

/* ---------------- Rules ---------------- */
const UNITS = {
  inf:  {name:'Infantry',   short:'INF', cost:25, oil:0,  metal:0,  mp:10, atk:3, def:3, hp:10, spd:4,  build:24, upk:1, food:1,   fuel:0, req:null},
  tank: {name:'Armor',      short:'ARM', cost:45, oil:6,  metal:15, mp:12, atk:6, def:4, hp:14, spd:6,  build:48, upk:3, food:1,   fuel:1, req:'fac'},
  art:  {name:'Artillery',  short:'ART', cost:40, oil:3,  metal:10, mp:10, atk:7, def:1, hp:8,  spd:3,  build:48, upk:2, food:1,   fuel:0, req:'fac'},
  jet:  {name:'Strike Jet', short:'AIR', cost:80, oil:12, metal:20, mp:6,  atk:8, def:3, hp:9,  spd:18, build:72, upk:6, food:0.5, fuel:2, req:'air'},
};
const RES = [
  {k:'cash',  name:'Money',    unit:'M', pre:'$'},
  {k:'oil',   name:'Oil',      unit:'',  pre:''},
  {k:'metal', name:'Metal',    unit:'',  pre:''},
  {k:'food',  name:'Food',     unit:'',  pre:''},
  {k:'mp',    name:'Manpower', unit:'k', pre:''},
];
const ICONS = {
  cash: '<path d="M2 4.5h12v7H2z" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="8" cy="8" r="1.9" fill="currentColor"/>',
  oil: '<path d="M8 1.8C6 5 4.2 7.2 4.2 9.6a3.8 3.8 0 0 0 7.6 0C11.8 7.2 10 5 8 1.8z" fill="currentColor"/>',
  metal: '<path d="M1.8 11.5l2.2-5h8l2.2 5z" fill="currentColor"/><path d="M5 6.5l1-2h4l1 2" fill="none" stroke="currentColor" stroke-width="1.2"/>',
  food: '<path d="M8 14V5" stroke="currentColor" stroke-width="1.3"/><ellipse cx="6" cy="5.5" rx="1.6" ry="2.6" transform="rotate(-25 6 5.5)" fill="currentColor"/><ellipse cx="10" cy="5.5" rx="1.6" ry="2.6" transform="rotate(25 10 5.5)" fill="currentColor"/><ellipse cx="8" cy="3" rx="1.4" ry="2.2" fill="currentColor"/>',
  mp: '<circle cx="8" cy="4.6" r="2.4" fill="currentColor"/><path d="M3 14c0-3.2 2.2-5.2 5-5.2s5 2 5 5.2z" fill="currentColor"/>',
};
const icon = (k, sz = 14) => `<svg width="${sz}" height="${sz}" viewBox="0 0 16 16" aria-hidden="true">${ICONS[k]}</svg>`;
const UT = Object.keys(UNITS);
const SEA_SPEED = 5;                  // hexes/day for embarked ground units
const BUILD = {
  fac:  {name:'Arms Factory',      max:3, cost:60, metal:20, days:3, where:'city', desc:'Needed for Armor and Artillery. Each level: +20% money here, units train 20% faster.'},
  air:  {name:'Airbase',           max:1, cost:90, metal:30, days:4, where:'city', desc:'Needed for Strike Jets (with Jet Engines research).'},
  ref:  {name:'Refinery',          max:2, cost:50, metal:15, days:3, where:'oil',  desc:'+60% oil from this field per level.'},
  fdy:  {name:'Foundry',           max:2, cost:50, metal:10, days:3, where:'any',  desc:'+3 metal per level (+5 on ore deposits).'},
  farm: {name:'Farms',             max:2, cost:30, metal:0,  days:2, where:'any',  desc:'+3 food per level.'},
  rec:  {name:'Recruiting Office', max:1, cost:30, metal:0,  days:2, where:'any',  desc:'+3 manpower per day.'},
  fort: {name:'Fortifications',    max:3, cost:40, metal:15, days:2, where:'any',  desc:'Defenders here take 20% less damage per level.'},
};
const BK = Object.keys(BUILD);
const ROMAN = ['', 'I', 'II', 'III'];
const TECH = [
  {id:'inf1',  branch:'Infantry',  name:'Ceramic Body Armor',   cost:60,  days:3, req:null,    desc:'Infantry defense +1',                  fx:{inf:{def:1}}},
  {id:'inf2',  branch:'Infantry',  name:'Mechanized Infantry',  cost:110, days:5, req:'inf1',  desc:'Infantry attack +1 and speed +1',      fx:{inf:{atk:1, spd:1}}},
  {id:'inf3',  branch:'Infantry',  name:'Special Forces',       cost:180, days:7, req:'inf2',  desc:'Infantry attack +1 and defense +1',    fx:{inf:{atk:1, def:1}}},

  else if (pointers.size === 2){ const [a, b] = [...pointers.values()]; pinch = {d:Math.hypot(a.x - b.x, a.y - b.y), s:view.s}; drag = null; }

function tap(x, y){
  for (let i = hits.length - 1; i >= 0; i--){ const h = hits[i];
    if (x >= h.x && x <= h.x + h.w && y >= h.y && y <= h.y + h.h){
      if (h.spread){ zoomAt(2.4, h.cx, h.cy); return; }
      const own = h.ids.map(armyById).filter(a => a && a.owner === PLAYER);
      if (own.length){
        if (own.some(a => a.id === sel.army)){
          if (own.length > 1){ const i2 = own.findIndex(a => a.id === sel.army); selectArmy(own[(i2 + 1) % own.length].id); }
          else { const a = armyById(sel.army); selectProv(a.to === null ? a.at : null); }
        } else selectArmy(own[0].id);
        return;
      }
      break;
    } }
  const p = provAt(x, y);
  if (p < 0 || (G.P[p].sea && sel.army === null)){ clearSel(); return; }
  const a = sel.army !== null ? armyById(sel.army) : null;
  if (a){
    if (a.to === null && p === a.at){ selectProv(p); return; }
    if (sel.target === p){ sendToTarget(a); return; }
    setTarget(a, p); return;
  }
  selectProv(p);
}
function setTarget(a, p){ sel.target = p; targetPath = findPath(a.to !== null ? a.to : a.at, p); hoverPath = null; renderSide(true); }
function sendToTarget(a){ if (sel.target !== null) orderMove(a, sel.target); sel.target = null; targetPath = null; renderSide(true); }
function selectArmy(id){ sel.army = id; sel.prov = null; sel.target = null; targetPath = null; hoverPath = null; renderSide(true); }

function clearSel(){ sel.army = null; sel.prov = null; sel.target = null; targetPath = null; hoverPath = null; renderSide(true); }

  if (mine && P.city){
    html += `<div class="eyebrow">Recruit</div><div class="units">${UT.map(t => { const U = UNITS[t];
      const why = !unlocked(PLAYER, t) ? 'Research Jet Engines' : !bldOk(p, t) ? `Needs ${BUILD[U.req].name}` : '';
      const h = Math.round(U.build*(1 - 0.2*S.bld[p].fac));
      return `<button class="btn unit" data-act="recruit" data-t="${t}" ${canRecruit(PLAYER, p, t) ? '' : 'disabled'}><span class="nm">${U.name}</span><span class="cost">${why || `$${U.cost}M${U.oil ? ` · ${U.oil} oil` : ''}${U.metal ? ` · ${U.metal} metal` : ''} · ${U.mp}k`}</span><span class="st">ATK ${Math.round(st(PLAYER, t, 'atk'))} DEF ${st(PLAYER, t, 'def')} SPD ${+st(PLAYER, t, 'spd').toFixed(1)} · ${+(h/24).toFixed(1)}d</span></button>`; }).join('')}</div>`;
    const q = S.queue[p];
    if (q.length) html += `<div class="queue">${q.map((it, i) => `<div class="qi"><span>${UNITS[it.t].name}</span><span class="muted">${i === 0 ? it.h + ' h left' : 'queued'}</span></div>${i === 0 ? `<div class="bar"><i style="width:${Math.round((1 - it.h/(it.h0 || UNITS[it.t].build))*100)}%"></i></div>` : ''}`).join('')}</div>`;
  }
  if (mine){
    const c = S.cons[p];
    html += `<div class="eyebrow">Construction</div>`;
    if (c) html += `<div class="queue"><div class="qi"><span>${BUILD[c.k].name}${BUILD[c.k].max > 1 ? ' ' + ROMAN[c.lvl] : ''}</span><span class="muted">${c.h} h left</span></div><div class="bar"><i style="width:${Math.round((1 - c.h/c.h0)*100)}%"></i></div></div>`;
    html += `<div>${BK.filter(k => canBuildHere(p, k)).map(k => { const B = BUILD[k], lv = S.bld[p][k], nl = lv + 1, cc = buildCost(PLAYER, k, nl);
      const maxed = lv >= B.max, ok = !maxed && !c && N.cash >= cc.cash && N.metal >= cc.metal;
      return `<div class="bld"><span><span class="nm">${B.name}</span> <span class="lv">${lv ? (B.max > 1 ? 'Level ' + ROMAN[lv] : 'Built') : ''}</span></span>
        ${maxed ? '<span class="lv">Max</span>' : `<button class="btn" data-act="build" data-k="${k}" ${ok ? '' : 'disabled'}>${lv ? 'Upgrade' : 'Build'} · $${cc.cash}M${cc.metal ? ' · ' + cc.metal + ' metal' : ''} · ${B.days}d</button>`}
        <span class="ds">${B.desc}</span></div>`; }).join('')}</div>`;
  } else if (!own.length) html += `<p class="small muted" style="margin:0">Select one of your forces, then tap this province to attack it.</p>`;
  html += `<div class="row"><button class="btn" data-act="clear">Close</button></div>`;
  return html;
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act],[data-speed]'); if (!b || b.disabled) return;
  if (b.dataset.speed !== undefined){ setSpeed(+b.dataset.speed); return; }
  const act = b.dataset.act, a = sel.army !== null ? armyById(sel.army) : null;
  switch (act){
    case 'army': selectArmy(+b.dataset.id); { const x = armyById(+b.dataset.id); if (x){ const [wx, wy] = armyPos(x); const [sx, sy] = toScreen(wx, wy); if (sx < 0 || sy < 0 || sx > cw || sy > ch) centerOn(wx, wy); } } break;
    case 'prov': selectProv(+b.dataset.id); break;
    case 'goto': { const P = G.P[+b.dataset.id]; centerOn(P.x, P.y, Math.max(view.s, 1.1)); if (!P.sea) selectProv(P.id); break; }
    case 'clear': clearSel(); break;
    case 'send': if (a) sendToTarget(a); break;
    case 'untarget': sel.target = null; targetPath = null; renderSide(true); break;
    case 'split': if (a){ const nb = splitArmy(a); if (nb) selectArmy(nb.id); } break;
    case 'merge': if (a && a.to === null){ for (const b2 of S.armies) if (b2 !== a && b2.owner === PLAYER && b2.at === a.at && b2.to === null) merge(a, b2); removeEmpty(); renderSide(true); } break;
    case 'stop': if (a){ a.path = []; renderSide(true); } break;
    case 'recruit': if (sel.prov !== null && recruit(PLAYER, sel.prov, b.dataset.t)) renderSide(true); break;
    case 'build': if (sel.prov !== null && build(PLAYER, sel.prov, b.dataset.k)) renderSide(true); break;
    case 'zin': zoomAt(1.4, cw/2, ch/2); break;
    case 'zout': zoomAt(1/1.4, cw/2, ch/2); break;
    case 'zfit': fit(); break;
    case 'home': goHome(); break;
    case 'help': showBriefing(false); break;
    case 'research-open': openModal(researchHTML(), 'research'); break;
    case 'research': if (startResearch(PLAYER, b.dataset.id)) renderSide(true); break;
    case 'pick': pickSel = +b.dataset.p; showPicker(); break;
    case 'begin': clearSave(); newGame((Math.random()*2**31) | 0, pickSel); S.started = true; save(); clearSel(); showBriefing(true, false); break;
    case 'start': closeModal(false); goHome(); setSpeed(1); break;
    case 'resume': closeModal(); break;
    case 'continue': { const d = loadSaved(); if (d && restore(d)){ clearSel(); } closeModal(); goHome(); setSpeed(1); break; }
    case 'newgame': showPicker(); break;
  }
});
$('modal').addEventListener('click', e => { if (e.target.id === 'modal' && modalKind === 'research') closeModal(); });
document.addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('input,textarea')) return;
  if (e.code === 'Space'){ e.preventDefault(); setSpeed(S.speed ? 0 : 1); }
  else if (e.key === '1' || e.key === '2' || e.key === '3') setSpeed(+e.key);
  else if (e.key === 'Escape'){ if (!$('modal').hidden){ if (S && S.started && !S.over && modalKind !== 'picker-first') closeModal(); } else clearSel(); }
  else if (e.key === 'h' || e.key === 'H') goHome();
  else if (e.key === 'r' || e.key === 'R'){ if (modalKind === 'research') closeModal(); else if ($('modal').hidden) openModal(researchHTML(), 'research'); }
});
function setSpeed(s){ if (S.over && s) return; if (s && !$('modal').hidden) return; S.speed = s; renderSide(); }

/* ---------------- Modal ---------------- */
let modalKind = '', pickSel = POWERS.findIndex(p => p.name === 'Brazil');
const DIFF = {Brazil:'Easy', China:'Easy', Australia:'Easy', Canada:'Easy', Russia:'Easy', 'United States':'Normal', India:'Normal', 'South Africa':'Normal'};
let speedBefore = 0;
function openModal(html, kind = ''){ modalKind = kind; if (S && $('modal').hidden){ speedBefore = S.speed; } if (S) S.speed = 0; $('sheet').className = 'sheet' + (kind === 'research' ? ' wide' : kind === 'picker' ? ' mid' : ''); $('sheet').innerHTML = html; lastSig.sheet = html; $('modal').hidden = false; $('sheet').scrollTop = 0; if (S) renderSide(); }
function closeModal(restore = true){ $('modal').hidden = true; modalKind = ''; if (restore && S && !S.over && S.started) S.speed = speedBefore; renderSide(true); }
function rules(){ return `<ul>
  <li><b>Recruit</b> in your cities (squares and your capital star). Units cost cash, oil and manpower, and take days to train.</li>
  <li><b>Move</b> by tapping one of your counters, then a province or sea zone to plan the route. Tap it again, or press Send, to march. Troops embark automatically to cross water.</li>
  <li><b>Capture</b> by parking ground units in a province with no defenders. Cities and capitals take longer. Air units can fight but cannot capture.</li>
  <li><b>Battles</b> run hour by hour. Defenders on their own soil take less damage, troops at sea take more.</li>
  <li><b>Research</b> new technology from the Research button (or press R). Strike Jets need Jet Engines first.</li>
  <li>The darker, hatched land is under fog of war: you only see enemy troops next to your land or your forces.</li>
  <li>Rival powers spend the first week taking independent land. After day 8, expect them at your borders.</li>
</ul>`; }
function provCount(pi){ const ci = powerCountry(POWERS[pi]); return ci >= 0 ? G.countries[ci].provs.length : 0; }
function showPicker(){
  if (!G) G = loadWorld();
  const cards = POWERS.map((P0, i) => { const n = provCount(i), cities = (G.countries[powerCountry(P0)]?.provs || []).filter(id => G.P[id].city).length;
    const diff = DIFF[P0.name] || 'Hard';
    return {i, n, html:`<button class="btn pick" style="--c:${P0.color}" data-act="pick" data-p="${i}" aria-pressed="${i === pickSel}"><b>${P0.name}</b><span>${n} provinces · ${cities} cities</span><span class="diff">${diff}</span></button>`}; })
    .sort((a, b) => b.n - a.n).map(c => c.html).join('');
  openModal(`<div class="eyebrow">New campaign</div><h1>Choose your nation</h1>
    <p>Fifteen powers fight for the world. Big nations start with more land and cities; small ones must expand fast. Every other country is independent and can be taken.</p>
    <div class="picks">${cards}</div>
    <div class="row"><button class="btn primary" data-act="begin">Lead ${POWERS[pickSel].name}</button>${S && S.started && !S.over ? `<button class="btn" data-act="resume">Back</button>` : ''}</div>`, 'picker');
}
function showBriefing(first, hasSave){
  const sv = hasSave ? loadSaved() : null, me = sv ? sv.nations[0] : S.nations[PLAYER];
  openModal(`<div class="eyebrow">Campaign briefing</div><h1>Iron Meridian</h1>
    ${sv ? `<p class="nudge">Saved campaign: <b>${me.name}</b>, day ${dayOf(sv.hour)}.</p>` : ''}
    <p>You command <b style="color:${me.color}">${me.name}</b>, one of fifteen powers in a world at war. Take independent land, out-produce your rivals and hold ${Math.ceil(G.landCount*WIN_SHARE)} of ${G.landCount} land provinces.</p>
    ${rules()}
    <p class="small muted">Your land has a bright outline and your capital says YOUR CAPITAL. Drag to pan, scroll or pinch to zoom, use the minimap to jump. Space pauses, 1–3 set speed, R opens research, H jumps home. Progress saves in this browser each game day.</p>
    <div class="row">${first
      ? (hasSave ? `<button class="btn primary" data-act="continue">Continue campaign</button><button class="btn" data-act="newgame">New campaign</button>` : `<button class="btn primary" data-act="start">Start campaign</button>`)
      : `<button class="btn primary" data-act="resume">Back to the map</button><button class="btn" data-act="newgame">New campaign…</button>`}</div>`);
}
function showEnd(){
  const win = S.over === 'win', mine = S.owner.filter(o => o === PLAYER).length;
  openModal(`<div class="eyebrow">${clockStr(S.hour)}</div><h1>${win ? 'Victory' : 'Defeat'}</h1>
    <p>${S.overReason === 'time' ? `Day ${DAY_LIMIT} has ended. ${win ? `${S.nations[PLAYER].name} finishes with the top score (${score(PLAYER)}).` : `${S.nations[PLAYER].name} scored ${score(PLAYER)}, behind the leader.`}` : ''}
    ${S.overReason && S.overReason !== 'time' ? `${S.overReason} has achieved world dominance.` : ''}
    ${!S.overReason ? (win ? `${S.nations[PLAYER].name} controls ${mine} of ${G.landCount} land provinces and ${capsHeld(PLAYER)} capitals. The world is yours.` : `${S.nations[PLAYER].name} has lost its last city.`) : ''}${!win && S.nations[PLAYER].cash > 200 ? ` You had $${fmt(S.nations[PLAYER].cash)}M unspent: next time, turn money into troops and research early.` : ''}</p>
    <div class="row"><button class="btn primary" data-act="newgame">New campaign</button><button class="btn" data-act="resume">View the map</button></div>`);
}

/* ---------------- Loop & boot ---------------- */
let last = 0, acc = 0, uiAcc = 0;
function frame(now){
  const dt = Math.min(0.25, (now - (last || now))/1000); last = now;
  if (S.speed && !S.over){ acc += dt*HOURS_PER_SEC[S.speed]; let n = 0; while (acc >= 1 && n < 8){ tick(); acc -= 1; n++; } if (n >= 8) acc = 0; }
  uiAcc += dt; if (uiAcc > 0.25){ uiAcc = 0; renderSide(); if (mouse && !tip.hidden) tipShow(mouse.x, mouse.y); }
  draw(now);
  requestAnimationFrame(frame);
}
function start(data){
  const css = getComputedStyle(document.documentElement);
  MONO = css.getPropertyValue('--mono').trim() || MONO; BODY = css.getPropertyValue('--body').trim() || BODY; DISPLAY = css.getPropertyValue('--display').trim() || DISPLAY;
  const saved = loadSaved();
  let resumed = false;
  if (data && data.state && restore(data.state)) resumed = true;
  if (!resumed) newGame((Math.random()*2**31) | 0, pickSel);
  resize(); if (resumed && data.view) Object.assign(view, data.view); else goHome();
  new ResizeObserver(() => resize()).observe(cv);
  renderSide(true);
  if (!resumed){ if (saved && saved.v === 3 && !saved.over) showBriefing(true, true); else showPicker(); }
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => renderSide(true));
  booted = true;
  requestAnimationFrame(frame);
}
if (location.protocol === 'file:') window.__im = {get S(){ return S; }, get G(){ return G; }, view, toScreen: (x, y) => toScreen(x, y), tick: () => tick(), findPath: (a, b) => findPath(a, b), orderMove: (a, p) => orderMove(a, p), selectProv: p => selectProv(p), selectArmy: id => selectArmy(id)};
document.addEventListener('visibilitychange', () => { if (document.hidden && S) save(); });
const hot = window.claude && window.claude.hot;
if (hot && hot.snapshot) try { hot.snapshot(() => ({state:serialize(), view:{...view}})); } catch (e) {}
if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
})();
</script>
